<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="_css/stylo.css">
</head>
<body>
    <h1>Figuras Mitológicas</h1>
    <div>
        <form class="tabela1">
            <h3>Dados pessoais:</h3>
            <p>Nome: <input type="text" name="nome"></p>
            <p>E-mail: <input type="text" name="email"></p>
            <p>Telefone: <input type="tel" name="cell"></p>
            <p>Idade: <input type="number" name="idade"></p>
            <input id="botao" type="submit" value="Cadastrar">
        </form>
    </div>
    <div>
        <form class="tabela2">
        <h3>Qual a sua figura mitológica favorita?</h3>
        <select>
            <option>Vampiro</option>
            <option>Sereia</option>
            <option>Fada</option>
            <option>Gnomo</option>
            <option>Lobisomem</option>
            <option>Curupira</option>
            <option>Boto cor de rosa</option>
            <option>Minotauro</option>
             <option>Gargula</option>
        </select>
        </form>
    </div>
    <fieldset>
        <legend>Qual desses você seria?</legend>
        <input type="radio" name="opcao">Gnomo
        <input type="radio" name="opcao">Gargula
        <input type="radio" name="opcao">Sereia
        <input type="radio" name="opcao">Fada
    </fieldset>
    <hr>
    <div>
    <h3 class="boing">O que você mais gosta nessas figuras?</h3>
    <textarea></textarea>
    </div>
    <hr>
    <div class="tabela3">
        <h3>Quais poderes você gostaria de ter?</h3>
        <input type="checkbox">Voar
        <input type="checkbox">Super força
        <input type="checkbox">Telecinese
        <input type="checkbox">Controlar o tempo
    </div>
    
</body>
</html>
